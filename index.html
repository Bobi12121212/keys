<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KEY ID // Кремена Иванова Васева</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
    body {
      background-color: #05070a;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.14), transparent 60%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 26px 26px, 26px 26px;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .pass {
      position: relative;
      width: 100%;
      max-width: 390px;
      background: rgba(12, 16, 24, 0.92);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 22px;
      padding: 26px 22px;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.12), inset 0 0 20px rgba(0, 240, 255, 0.04);
      overflow: hidden;
    }
    .pass::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00f0ff, #3b82f6, transparent);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #38bdf8;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 5px 11px;
      border-radius: 999px;
      font-weight: 700;
    }
    .dot {
      width: 8px; height: 8px;
      background: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f0ff;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    .icon-wrap {
      width: 58px; height: 58px;
      margin: 0 auto 14px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.18), rgba(59, 130, 246, 0.18));
      border: 1px solid rgba(0, 240, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 {
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.45;
      margin-bottom: 22px;
    }
    .data-grid {
      background: #080b10;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 15px 16px;
      margin-bottom: 20px;
    }
    .row {
      padding: 8px 0;
    }
    .row:first-child {
      border-bottom: 1px dashed #1e293b;
      padding-top: 2px;
      padding-bottom: 12px;
    }
    .row:last-child {
      padding-top: 12px;
      padding-bottom: 2px;
    }
    .lbl {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 3px;
    }
    .val {
      font-size: 16.5px;
      font-weight: 700;
      color: #f8fafc;
    }
    .val.num {
      font-size: 19px;
      color: #00f0ff;
      letter-spacing: 0.5px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      font-size: 15.5px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, #00f0ff, #2563eb);
      color: #030712;
      box-shadow: 0 6px 20px rgba(0, 240, 255, 0.28);
      margin-bottom: 10px;
    }
    .btn-secondary {
      background: #111827;
      color: #cbd5e1;
      border: 1px solid #1f2937;
      font-size: 14px;
    }
    .footer-tag {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: #475569;
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>
  <div class="pass">
    <div class="top-bar">
      <div class="status"><span class="dot"></span> NFC TAG ACTIVE</div>
      <span>ID #01</span>
    </div>

    <div class="icon-wrap">🔑</div>
    <h1>Намерени ключове</h1>
    <p class="subtitle">Този ключодържател е защитен с NFC. Моля, свържете се със собственика, за да ги върнете.</p>

    <div class="data-grid">
      <div class="row">
        <div class="lbl">Собственик</div>
        <div class="val">Борис Димитров Желязков</div>
      </div>
      <div class="row">
        <div class="lbl">Телефон за връзка</div>
        <div class="val num">+123456789</div>
      </div>
    </div>

    <a href="tel:+359876342968" class="btn btn-primary">📞 Обади се на собственика</a>
    <button onclick="copyPhone()" id="copyBtn" class="btn btn-secondary">📋 Копирай номера</button>

    <div class="footer-tag">SMART KEY RECOVERY SYSTEM</div>
  </div>

  <script>
    function copyPhone() {
      navigator.clipboard.writeText("+359876342968");
      const btn = document.getElementById("copyBtn");
      btn.textContent = "✅ Номерът е копиран!";
      setTimeout(() => { btn.textContent = "📋 Копирай номера"; }, 2500);
    }
  </script>
</body>
</html>
