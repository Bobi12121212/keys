<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Намерени ключове – NFC Recovery</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #050911;
      background-image: radial-gradient(circle at 50% 0%, #0d253f 0%, #050911 68%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 385px;
      background: #0c1421;
      border: 1px solid rgba(56, 189, 248, 0.22);
      border-radius: 26px;
      padding: 24px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      text-align: center;
    }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 11px; font-weight: 700; letter-spacing: 0.9px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; padding: 5px 11px; border-radius: 999px; }
    .dot { width: 6px; height: 6px; background: #34d399; border-radius: 50%; }
    .tag-id { color: #64748b; background: rgba(255, 255, 255, 0.05); padding: 5px 10px; border-radius: 999px; }
    .icon-box { width: 58px; height: 58px; margin: 0 auto 16px; background: #10263e; border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
    h1 { font-size: 23px; margin-bottom: 8px; font-weight: 800; }
    .subtitle { font-size: 13.5px; color: #94a3b8; line-height: 1.5; margin-bottom: 22px; }
    .reward-box { display: none; background: rgba(250, 204, 21, 0.12); border: 1px solid rgba(250, 204, 21, 0.35); color: #fde047; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; font-weight: 700; margin-bottom: 16px; }
    .details-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; text-align: left; }
    .detail-item { display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 12px 14px; }
    .detail-icon { width: 38px; height: 38px; border-radius: 11px; background: rgba(56, 189, 248, 0.12); color: #38bdf8; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .detail-content { display: flex; flex-direction: column; overflow: hidden; }
    .detail-label { font-size: 10.5px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 2px; }
    .detail-value { font-size: 16.5px; font-weight: 700; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-phone { font-size: 17.5px; font-weight: 800; color: #38bdf8; text-decoration: none; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 14px; font-size: 15.5px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; margin-bottom: 10px; }
    .btn-call { background: linear-gradient(135deg, #00e5ff, #2563eb); color: #031122; }
    .btn-viber { background: linear-gradient(135deg, #7c3aed, #5b21b6); color: #ffffff; }
    .btn-copy { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #cbd5e1; margin-bottom: 4px; }
    .footer { margin-top: 16px; font-size: 10px; color: #475569; letter-spacing: 1.6px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-bar">
      <div class="badge"><span class="dot"></span> NFC TAG ACTIVE</div>
      <div class="tag-id" id="tagId">ID #01</div>
    </div>

    <div class="icon-box">🔑</div>
    <h1>Намерени ключове</h1>
    <p class="subtitle">Този ключодържател е защитен с NFC. Моля, свържете се със собственика, за да ги върнете.</p>

    <div class="reward-box" id="rewardBox"></div>

    <div class="details-group">
      <div class="detail-item">
        <div class="detail-icon">👤</div>
        <div class="detail-content">
          <span class="detail-label">Собственик</span>
          <span class="detail-value" id="ownerName">Борис Димитров Желязков</span>
        </div>
      </div>

      <div class="detail-item">
        <div class="detail-icon">📱</div>
        <div class="detail-content">
          <span class="detail-label">Телефон за връзка</span>
          <a class="detail-phone" id="ownerPhoneText" href="tel:+359876342968">+359 876 342 968</a>
        </div>
      </div>
    </div>

    <a class="btn btn-call" id="callBtn" href="tel:+359876342968">📞 Обади се на собственика</a>
    <a class="btn btn-viber" id="viberBtn" href="viber://chat?number=%2B359876342968">💬 Пиши във Viber</a>
    <button class="btn btn-copy" onclick="copyPhone()">📋 Копирай номера</button>

    <div class="footer">SMART KEY RECOVERY SYSTEM</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const name = params.get("name");
    const phone = params.get("phone");
    const reward = params.get("reward");

    if (id) document.getElementById("tagId").textContent = "ID #" + id;
    if (name) document.getElementById("ownerName").textContent = name;

    if (phone) {
      const cleanPhone = phone.replace(/\s+/g, "");
      const formattedPhone = cleanPhone.startsWith("+") ? cleanPhone : "+" + cleanPhone;
      const displayPhone = formattedPhone.replace(/(\+\d{3})(\d{3})(\d{3})(\d+)/, "$1 $2 $3 $4");

      document.getElementById("ownerPhoneText").textContent = displayPhone;
      document.getElementById("ownerPhoneText").href = "tel:" + formattedPhone;
      document.getElementById("callBtn").href = "tel:" + formattedPhone;
      document.getElementById("viberBtn").href = "viber://chat?number=" + encodeURIComponent(formattedPhone);
    }

    if (reward) {
      const rewardEl = document.getElementById("rewardBox");
      rewardEl.textContent = "🎁 " + reward;
      rewardEl.style.display = "block";
    }

    function copyPhone() {
      const rawPhone = document.getElementById("ownerPhoneText").getAttribute("href").replace("tel:", "");
      navigator.clipboard.writeText(rawPhone);
      const btn = document.querySelector(".btn-copy");
      btn.textContent = "✅ Номерът е копиран!";
      setTimeout(() => { btn.textContent = "📋 Копирай номера"; }, 2000);
    }
  </script>
</body>
</html>
